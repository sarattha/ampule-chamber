name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/validate_release_metadata.py "$RELEASE_TAG"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Run release quality gate
        run: make check

      - name: Validate built distributions
        run: uv run twine check dist/*

      - name: Extract image metadata
        id: image-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build release candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ampule-chamber:release-candidate
          labels: ${{ steps.image-meta.outputs.labels }}
          provenance: false
          cache-to: type=gha,mode=max

      - name: Scan release candidate image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ampule-chamber:release-candidate
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified control-plane image
        id: image-build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image-meta.outputs.tags }}
          labels: ${{ steps.image-meta.outputs.labels }}
          provenance: true
          cache-from: type=gha

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate package SBOM
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: syft dist --output "spdx-json=ampule-chamber-${RELEASE_TAG}.spdx.json"

      - name: Generate image SBOM
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          syft "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.image-build.outputs.digest }}" \
            --output "spdx-json=ampule-chamber-image-${RELEASE_TAG}.spdx.json"

      - name: Attest image provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image-build.outputs.digest }}
          push-to-registry: true

      - name: Attest package provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: Skip package provenance attestation
        if: ${{ github.event.repository.private }}
        run: |
          echo "Skipping package provenance attestation because GitHub attestations are not available for user-owned private repositories."

      - name: Extract release notes
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib

          version = os.environ["RELEASE_VERSION"].lstrip("v")
          changelog = pathlib.Path("CHANGELOG.md").read_text().splitlines()
          target = f"## {version} -"
          capture = False
          lines = []

          for line in changelog:
              if line.startswith("## "):
                  if capture:
                      break
                  capture = line.startswith(target)
                  continue
              if capture:
                  lines.append(line)

          text = "\n".join(lines).strip()
          if not text:
              raise SystemExit(f"missing CHANGELOG.md notes for {version}")
          pathlib.Path("release-notes.md").write_text(text + "\n", encoding="utf-8")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: |
            dist/*.tar.gz
            dist/*.whl
            CHANGELOG.md
            ampule-chamber-${{ github.ref_name }}.spdx.json
            ampule-chamber-image-${{ github.ref_name }}.spdx.json
