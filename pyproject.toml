[build-system]
requires = ["uv_build>=0.11.10,<0.12.0"]
build-backend = "uv_build"

[project]
name = "ampule-chamber"
version = "1.3.0"
description = "Production-ready agent-driven reliability testing chamber for Kubernetes services."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Sarattha", email = "j.sarattha@gmail.com" },
]
maintainers = [
  { name = "Sarattha", email = "j.sarattha@gmail.com" },
]
keywords = [
  "kubernetes",
  "reliability",
  "chaos-engineering",
  "load-testing",
  "observability",
  "agents",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "openai-agents>=0.17.5",
  "PyYAML>=6.0.2",
]

[project.urls]
Homepage = "https://github.com/sarattha/ampule-chamber"
Documentation = "https://sarattha.github.io/ampule-chamber/"
Issues = "https://github.com/sarattha/ampule-chamber/issues"
Releases = "https://github.com/sarattha/ampule-chamber/releases"
Repository = "https://github.com/sarattha/ampule-chamber"

[project.scripts]
ampule-chamber = "chamber.workflow:main"
ampule-chamber-report = "chamber.report.cli:main"

[project.optional-dependencies]
dev = []

[dependency-groups]
dev = [
  "coverage>=7.10.0",
  "mkdocs>=1.6.1",
  "mkdocs-material>=9.6.0",
  "ruff>=0.12.0",
  "twine>=6.1.0",
  "ty>=0.0.49",
  "types-PyYAML>=6.0.12.20250516",
]

[tool.uv.build-backend]
module-name = "chamber"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
branch = true
source = ["chamber"]

[tool.coverage.report]
show_missing = true
fail_under = 90
