apiVersion: chamber.ampule.dev/v1alpha1
kind: ChamberConfig
service:
  name: sample-service
  repo: .
deployment:
  manifests:
    - docs/internal/phases/phase-13-one-command-assessment/artifacts/kind-sample-manifests.yaml
  images: {}
  workloads:
    - name: sample-service
      role: target
      kind: Deployment
      readiness:
        - ready
    - name: sample-service
      role: target
      kind: Service
traffic:
  entrypoint: sample-service
  journeys:
    - name: baseline
      method: GET
      path: /healthz
      expectedStatus: 200
dependencies:
  internal: []
  external: []
runtime:
  provider: kubernetes
  kubernetesContext: kind-ampule-chamber
  namespaceBase: chamber-kind-sample
  cleanup: true
  trafficAccess:
    mode: port-forward
    service: sample-service
    servicePort: 8080
    localPort: 28180
  requiredEnv: []
  secretEnv: []
  config: {}
agents:
  mode: "off"
assumptions:
  - Reviewed local kind verification config for the bundled sample service.
  - The image ampule/sample-service:local must be built locally and loaded into kind before assessment.
