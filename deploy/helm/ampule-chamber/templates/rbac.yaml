{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ampule-chamber.fullname" . }}-namespace-reader
  labels:
    {{- include "ampule-chamber.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ampule-chamber.fullname" . }}-namespace-reader
  labels:
    {{- include "ampule-chamber.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ampule-chamber.fullname" . }}-namespace-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "ampule-chamber.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- range $namespace := .Values.discovery.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ampule-chamber.fullname" $ }}-target-reader
  namespace: {{ $namespace }}
  labels:
    {{- include "ampule-chamber.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  {{- if $.Values.rbac.allowFaults }}
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ampule-chamber.fullname" $ }}-target-reader
  namespace: {{ $namespace }}
  labels:
    {{- include "ampule-chamber.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ampule-chamber.fullname" $ }}-target-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "ampule-chamber.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
