{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ampule-chamber.authSecretName" . }}
  labels:
    {{- include "ampule-chamber.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.secretKey }}: {{ required "auth.adminToken or auth.existingSecret is required" .Values.auth.adminToken | quote }}
{{- end }}
