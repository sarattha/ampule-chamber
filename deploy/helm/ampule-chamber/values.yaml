replicaCount: 1

image:
  repository: ghcr.io/sarattha/ampule-chamber
  tag: "1.5.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

auth:
  adminToken: ""
  existingSecret: ""
  secretKey: admin-token
  secureCookies: false

kubernetes:
  context: in-cluster

discovery:
  namespaces: []

persistence:
  enabled: true
  retain: true
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 5Gi

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true
  allowFaults: false

service:
  type: ClusterIP
  port: 8765

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ampule-chamber.example.internal
  tls: []

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: "1"
    memory: 1Gi

nodeSelector: {}
tolerations: []
affinity: {}
