<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token | default('') }}">
  <title>{% block title %}Ampule Chamber{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
  <script src="{{ url_for('static', path='/app.js') }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="/runs" aria-label="Ampule Chamber runs">
      <span>Ampule Chamber</span>
    </a>
    <div class="topbar-status"><span class="status-dot"></span>Local control plane</div>
  </header>
  <div class="app-shell">
    <nav class="sidebar" aria-label="Product navigation">
      <a class="nav-item{% if active_nav == 'runs' %} active{% endif %}" href="/runs">Runs</a>
      <a class="nav-item{% if active_nav == 'new' %} active{% endif %}" href="/new">New assessment</a>
      <a class="nav-item" href="/compare">Compare</a>
      <div class="nav-divider"></div>
      <div class="nav-label">Workspace</div>
      <div class="nav-muted">Files remain local</div>
    </nav>
    <main class="main" id="main">{% block content %}{% endblock %}</main>
  </div>
</body>
</html>
