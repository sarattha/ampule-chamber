<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token | default('') }}">
  <title>{% block title %}Ampule Chamber{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}?v=1.10.0">
  <script src="{{ url_for('static', path='/app.js') }}?v=1.10.0" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="/runs" aria-label="Ampule Chamber runs">
      <span>Ampule Chamber</span>
    </a>
    <div class="topbar-actions">
      <div class="topbar-status" role="status"><span class="status-dot" aria-hidden="true"></span><span>Control plane ready</span></div>
      {% if auth_enabled %}<form method="post" action="/logout"><input type="hidden" name="_csrf" value="{{ csrf_token }}"><button class="button subtle compact" type="submit">Sign out</button></form>{% endif %}
    </div>
  </header>
  <div class="app-shell">
    <nav class="sidebar" aria-label="Product navigation">
      <a class="nav-item{% if active_nav == 'runs' %} active{% endif %}" href="/runs"{% if active_nav == 'runs' %} aria-current="page"{% endif %}>Runs</a>
      <a class="nav-item{% if active_nav == 'new' %} active{% endif %}" href="/new"{% if active_nav == 'new' %} aria-current="page"{% endif %}>New assessment</a>
      <a class="nav-item" href="/compare">Compare</a>
      <div class="nav-divider"></div>
      <div class="nav-label">Workspace</div>
      <div class="nav-muted">Runs persist in workspace storage</div>
    </nav>
    <main class="main" id="main">{% block content %}{% endblock %}</main>
  </div>
</body>
</html>
